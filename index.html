<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maeoka Engenharia — Documentos Contratuais</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Mobile-first base styles */
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; line-height: 1.7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
        .container { max-width: 500px; width: 100%; }
        .header { background: linear-gradient(135deg, #1e3a8a 0%, #1a1a2e 100%); color: white; padding: 20px 16px; border-radius: 12px; text-align: center; margin-bottom: 16px; }
        .header h1 { font-size: 1.25rem; font-weight: 800; margin-bottom: 4px; }
        .header p { font-size: 0.8rem; opacity: 0.7; }
        a.card { display: block; background: white; border-radius: 10px; padding: 16px 18px; margin-bottom: 10px; text-decoration: none; color: #1a1a1a; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: transform 0.15s, box-shadow 0.15s; }
        a.card:active { transform: scale(0.98); }
        a.card h2 { font-size: 0.95rem; font-weight: 700; color: #1e3a8a; margin-bottom: 3px; }
        a.card p { font-size: 0.8rem; color: #666; }

        /* Very small screens (below 360px) */
        @media (max-width: 359px) {
            body { padding: 8px; }
            .header { padding: 16px 12px; border-radius: 10px; }
            .header h1 { font-size: 1.1rem; }
            a.card { padding: 14px 14px; border-radius: 8px; }
        }

        /* Larger screens (tablets and up) */
        @media (min-width: 480px) {
            body { padding: 20px; }
            .header { padding: 30px; border-radius: 16px; margin-bottom: 20px; }
            .header h1 { font-size: 1.4rem; margin-bottom: 5px; }
            .header p { font-size: 0.85rem; }
            a.card { border-radius: 12px; padding: 20px 25px; margin-bottom: 12px; }
            a.card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
            a.card h2 { font-size: 1rem; margin-bottom: 4px; }
            a.card p { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Maeoka Engenharia</h1>
            <p>Documentos Contratuais</p>
        </div>
        <a class="card" href="clausulas-contratuais-maeoka.html">
            <h2>Clausulas Contratuais do Cliente</h2>
            <p>Contrato completo assinado pelo contratante</p>
        </a>
        <a class="card" href="manual-contratacao-subempreiteiros.html">
            <h2>Manual de Contratacao de Subempreiteiros</h2>
            <p>Manual para prestadores de servico (MEIs)</p>
        </a>
        <a class="card" href="Meuprojeto.html">
            <h2>Questionario Meu Projeto</h2>
            <p>Questionario de obra para novos clientes</p>
        </a>
    </div>
</body>
</html>
